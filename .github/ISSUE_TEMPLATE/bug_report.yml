name: Bug report
description: Report something broken or not working as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search [existing issues](https://github.com/Safrochain-Org/safhandle-sdk/issues) first.

        **Do not use this form for security vulnerabilities.** See [SECURITY.md](https://github.com/Safrochain-Org/safhandle-sdk/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: getAddress("john") throws NetworkError on testnet.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Should return the registered owner address.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm install @safrochaindev/safhandle
        2. Call getAddress("john") on testnet
        3. Observe error
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - SDK core
        - Validation utilities
        - React hook (future)
        - Documentation
        - CI / tooling
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or main
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Node: 20.11.0
        - Network: safro-testnet-1
    validations:
      required: true
