name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
categories:
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Bug Fixes
    labels:
      - bug
      - fix
  - title: Security
    labels:
      - security
  - title: Documentation
    labels:
      - documentation
      - docs
  - title: Maintenance
    labels:
      - chore
      - dependencies
      - ci
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
      - feature
      - enhancement
  patch:
    labels:
      - patch
      - fix
      - documentation
      - docs
      - chore
  default: patch
